# .pre-commit-config.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Automated quality gates that run on every `git commit`.
#
# Install hooks once after cloning:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files
# ──────────────────────────────────────────────────────────────────────────────

repos:

  # ── Ruff: fast linter + formatter (replaces flake8 + black + isort) ─────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]           # auto-fix safe issues (imports, unused vars, etc.)
      - id: ruff-format         # opinionated formatter (Black-compatible)

  # ── General file hygiene ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Appending a newline stales the digests the trainer recorded.
        exclude: ^models/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
        # Without this the check returns early unless git is mid-merge, so a
        # committed conflict marker passes. CI is never mid-merge.
        args: [--assume-in-merge]
      - id: check-added-large-files
        # --enforce-all: a fresh CI checkout stages nothing, so the default
        # inspects an empty set. The two exclusions are the source datasets
        # that ship over the cap, matched in full so neighbours are caught.
        args: [--maxkb=5000, --enforce-all]
        exclude: ^(Resources/bls_state_data\.xlsx|us_state/us_state\.shp)$
      - id: debug-statements    # catch leftover pdb / breakpoint() calls
      - id: detect-private-key  # block accidental secret commits

  # ── Mypy static type checker ─────────────────────────────────────────────────
  # Project interpreter, not an isolated env: without fastapi, pydantic and
  # xgboost, typed returns degrade to Any and it reports errors CI does not.
  # `mypy` must be on PATH, so commit from the activated venv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        files: \.py$
        args: [api, pipeline.py, scripts, config_schema.py, streamlit_app.py]

  # ── Notebook cleanliness (strip output before committing) ───────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # Removes cell outputs so notebooks stay diff-friendly in git.
        # Outputs are regenerated locally by running the notebook.
