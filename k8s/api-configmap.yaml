# ── Config for the salary-api Deployment ───────────────────────────────────
# Points the initContainer at the model registry: the gated GitHub Release
# published by .github/workflows/train.yml, which runs the metric-band tests +
# artefact-integrity gate BEFORE publishing. `releases/latest/download/` tracks
# the newest gated release, so a redeploy needs no manual version bump. Two of
# these URLs 404 until the next training run: conformal_delta.json and the CSV
# joined the published asset set after the newest release was cut.
apiVersion: v1
kind: ConfigMap
metadata:
  name: salary-api-config
data:
  # URL must point to xgb_salary_model.ubj — the initContainer strips the
  # filename to derive sibling URLs for feature_names/group_means/metrics/etc.
  model-url: "https://github.com/MarwaBS/high-pay-salary-predictor/releases/latest/download/xgb_salary_model.ubj"
  data-url: "https://github.com/MarwaBS/high-pay-salary-predictor/releases/latest/download/cleaned_high_pay_data.csv"
  # Redis service URL within the cluster. Omit for no-op cache.
  redis-url: "redis://redis.default.svc.cluster.local:6379/0"
