---
# ============================================================
# Project Configuration — High-Paying Jobs in the US
# ============================================================
# Every key here is read by shipped code; nothing is kept for documentation.

# ── Data Paths ─────────────────────────────────────────────
data:
  cleaned: "Data/cleaned_high_pay_data.csv"

# ── Drift Monitor ──────────────────────────────────────────
drift:
  # Rolling observations the /drift verdict is computed over. Must clear both
  # DriftMonitor.effect_floor_handover(), below which a shift only just over
  # min_effect_size goes unreported, and MIN_WINDOW_FOR_VERDICT, below which no
  # verdict is issued at all; the API refuses to start otherwise. Anything above
  # is an operational choice — a longer window is steadier and slower to react.
  window: 500

# ── Cleaning Thresholds ────────────────────────────────────
thresholds:
  # Minimum annual income (Census CPS variable: INCTOT) to be
  # classified as "high-pay". Equivalent to ~$48.08/hr at 40h/52w.
  min_annual_income: 100000
  # Corresponding BLS hourly mean floor (100000 / 2080 hours).
  min_hourly_mean: 48.08

# ── Model Configuration ────────────────────────────────────
model:
  test_size: 0.20
  random_state: 42
  # Reproducibility input, not a speed knob — see config_schema.ModelConfig.
  n_jobs: 1
  # XGBoost hyper-parameters — multi-quantile XGBoost via
  # ``reg:quantileerror`` with ``quantile_alpha=[0.10, 0.50, 0.90]``.
  # Trained on log1p(Annual Income); callers must expm1() the prediction.
  n_estimators: 169
  max_depth: 3
  learning_rate: 0.045
  subsample: 0.741
  colsample_bytree: 0.829
  reg_lambda: 9.88      # L2 regularisation
  # Target transformation: model is trained on log1p(Annual Income).
  # Callers must expm1() the raw prediction to get dollar values.
  # Cross-validation
  cv_folds: 5
  # Seeds the trainer refits under to report metric spread across resplits.
  stability_seeds: [11, 22, 33, 44, 55]
  # Saved artefacts — XGBoost native format (.ubj) and JSON (no pickle)
  model_path: "models/xgb_salary_model.ubj"
  features_path: "models/feature_names.json"
  metrics_path: "models/model_metrics.json"
  group_means_path: "models/group_means.json"
  # Per-feature training distribution the drift monitor compares live traffic against.
  baseline_stats_path: "models/baseline_stats.json"
  # Cross-conformal interval margin (log space) — widens P10/P90 to nominal coverage.
  conformal_path: "models/conformal_delta.json"
  # Premium-tier classifier head — trained alongside the quantile
  # regressor on the same feature set. Predicts P(Annual Income >=
  # premium_threshold) *within the existing high-pay cohort*. It is the
  # next-best-layered task the filtered dataset supports; a broader unfiltered
  # >= $100K membership classifier would require raw IPUMS Census microdata
  # that is not in the repo.
  classifier_path: "models/xgb_premium_classifier.ubj"
  premium_threshold: 150000
  # Classifier head hyper-parameters — lighter than the regressor on purpose
  # (binary task with a larger margin; a deep booster overfits this 10K-row set).
  classifier_n_estimators: 200
  classifier_max_depth: 4
  classifier_learning_rate: 0.05
  classifier_subsample: 0.85
  classifier_colsample_bytree: 0.85
  classifier_reg_lambda: 1.0

# ── Visualization ──────────────────────────────────────────
visualization:
  dpi: 300
  colors:
    money_seq: "Blues"
    count_seq: "Greys"
    gender_male: "#2196F3"
    gender_female: "#E91E63"

# ── Education Ordinal Mapping ──────────────────────────────
# Used for both analysis and model feature encoding.
education_order:
  "Bachelor's degree": 1
  "Master's degree": 2
  "Professional degree": 3
  "Doctoral degree": 4

# ── Census Regional Classification ────────────────────────
