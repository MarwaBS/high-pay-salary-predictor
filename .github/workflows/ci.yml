name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly freshness re-scan (Mondays 05:00 UTC). Trivy findings and
    # pip-audit CVEs are a function of TIME, not of pushes — without this,
    # a quiet repo ships images whose last vulnerability scan silently ages.
    # The scheduled run re-executes the full existing pipeline (pip-audit,
    # tests, Docker build + Trivy scan on both images) on main.
    - cron: "0 5 * * 1"

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # let both Python versions run independently
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # tests/test_private_names_absent.py sweeps every commit message
          # reachable from HEAD. The default depth-1 checkout carries one commit,
          # and a sweep of one commit passes for the wrong reason, so the test
          # refuses to run against a shallow clone.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pip-audit

      - name: Security — audit dependencies for known CVEs
        run: |
          # Audit both the loose runtime set and the exact reproducible lock.
          pip-audit --requirement requirements.txt --skip-editable
          pip-audit --requirement requirements-lock.txt

      - name: Security — audit the dashboard image universe (3.12 only)
        # requirements-dashboard.txt is a `pip freeze` of the dashboard Docker
        # image, whose base is python:3.12-slim. Its exact pins (scipy==1.18.0,
        # numpy==2.4.6, pandas==3.0.3, …) only exist for CPython >=3.12, so on
        # the 3.11 matrix leg pip-audit's resolver cannot even construct the
        # set and errors before checking a single CVE — it would be auditing a
        # dependency universe that is never built or shipped (the image is
        # always 3.12). Gate the audit to the interpreter that matches the
        # artifact, mirroring the SBOM step's `== '3.12'` guard below. The
        # dashboard deps are still audited on every run, on their real Python.
        if: matrix.python-version == '3.12'
        run: |
          pip-audit --requirement requirements-dashboard.txt

      - name: Security — audit the HF Space extras (3.11 only)
        # The Space image is python:3.11-slim; audit its floor set on the
        # matching interpreter so the resolved universe mirrors a real build.
        if: matrix.python-version == '3.11'
        run: |
          pip-audit --requirement deploy/huggingface/requirements-space.txt

      - name: Generate CycloneDX SBOM (API runtime surface)
        # Standard 2026 supply-chain artifact. Scans requirements-api.txt
        # (what ships in the API Docker image) and emits a CycloneDX 1.5
        # JSON, uploaded as a CI artifact for downstream SCA / SLSA tooling.
        # The 90-day retention below is a request — effective duration is
        # bounded by the repository's artifact-retention policy.
        run: |
          pip-audit --requirement requirements-api.txt --skip-editable \
            --format=cyclonedx-json \
            --output=sbom-api.cyclonedx.json
      - name: Upload SBOM artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api-cyclonedx-${{ github.run_number }}
          path: sbom-api.cyclonedx.json
          retention-days: 90

      - name: Lint with ruff
        run: |
          ruff check . --output-format=github

      - name: Bandit security scan (source + api)
        # Complementary to pip-audit: static-analyses the project's own
        # code for issues bandit flags (hardcoded secrets, insecure
        # yaml.load, weak crypto, etc.). Fails on MEDIUM+ severity.
        run: |
          pip install bandit==1.9.4
          bandit -r api/ pipeline.py scripts/ config_schema.py streamlit_app.py -n 3 -ll

      - name: Format check with ruff
        run: |
          ruff format --check .

      - name: Enforce the repo-safety pre-commit hooks
        # Otherwise these protect only contributors who ran `pre-commit
        # install`. ruff does not cover debug-statements: T201 is flake8-print,
        # not flake8-debugger.
        if: matrix.python-version == '3.12'
        run: |
          pip install pre-commit
          pre-commit run --all-files detect-private-key
          pre-commit run --all-files check-added-large-files
          pre-commit run --all-files check-merge-conflict
          pre-commit run --all-files debug-statements

      - name: Type-check with mypy
        # streamlit_app.py is imported by nothing, so it is only checked when
        # named; the pre-commit hook covers the rest via import-following.
        run: |
          # mypy is pinned in requirements.txt; only the stubs are added here.
          pip install pandas-stubs
          mypy api pipeline.py scripts config_schema.py streamlit_app.py

      - name: Verify committed model artefacts (integrity gate)
        run: |
          # CI must test the committed artefacts the live demo serves — never a
          # model retrained in-job. verify_artifacts recomputes each artefact's
          # SHA-256 against model_metrics.json and fails on a missing, corrupt,
          # or desynced artefact.
          python -m scripts.verify_artifacts

      - name: Run pytest (with enforced coverage gate)
        env:
          CI: "true"
        run: |
          # --cov activates coverage; the fail_under=88 threshold in
          # pyproject.toml ([tool.coverage.report]) is then enforced and
          # fails the job if total coverage regresses below it. CI=true makes
          # the metric-band gates fail (not skip) on a missing metrics file.
          pytest tests/ -v --tb=short \
            --cov --cov-report=term-missing --cov-report=xml

  notebook-check:
    name: Notebook syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate notebook JSON
        run: |
          python - <<'EOF'
          import nbformat, glob, sys
          paths = glob.glob("notebooks/*.ipynb")
          if not paths:
              sys.exit("No notebooks found under notebooks/ — did they move? This gate would otherwise pass by validating nothing.")
          errors = []
          for path in paths:
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  print(f"  OK  {path}")
              except Exception as e:
                  errors.append(f"FAIL {path}: {e}")
                  print(f"FAIL {path}: {e}")
          if errors:
              sys.exit(1)
          EOF

  # ── Build the images on every change, so a broken Dockerfile blocks a PR ───
  # The deploy job below runs only after merge, too late to gate anything, and
  # tests/test_docker_image.py parses the Dockerfile rather than building it.
  docker-build:
    name: Docker build (no push)
    needs: [test]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build HuggingFace Space image
        # The Space image is built by HF from an assembled snapshot, so a break
        # here surfaces only after a push to the Space. Assemble and build it
        # here instead.
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          bash deploy/huggingface/assemble.sh . "$snapshot"
          docker build -f "$snapshot/Dockerfile" "$snapshot"

  # ── CD: Build & Push Docker images on merge to main ────────────────────────
  deploy:
    name: Build & Push Docker Images
    needs: [test, notebook-check]
    # Runs on merge to main AND on the weekly schedule (scheduled runs execute
    # on the default branch), so the Trivy image scans stay fresh over time.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image (load for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan API image (HIGH/CRITICAL, ignore-unfixed)
        # Container-layer vulnerability scan complementary to pip-audit.
        # `.trivyignore` at repo root holds managed-risk CVE IDs. Fails
        # the job BEFORE the push step, so a vulnerable image never
        # reaches GHCR.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: .trivyignore

      - name: Smoke test API image (health + real /predict on the shipped stack)
        # Runs against the locally LOADED image BEFORE the push, so a functionally
        # broken shipped stack (model that won't load/predict under numpy 1.26 /
        # pandas 2.2 / sklearn 1.5.2) blocks publication of :latest — detection
        # AND prevention, like the Trivy gate above.
        run: |
          set -euo pipefail
          docker run -d --name smoke-api -p 8000:8000 \
            -v ${{ github.workspace }}/models:/app/models:ro \
            -v ${{ github.workspace }}/Data:/app/Data:ro \
            ${{ env.IMAGE_BASE }}/api:${{ github.sha }}

          cleanup() { docker logs smoke-api || true; docker stop smoke-api || true; }
          trap cleanup EXIT

          # Poll /health with a retry loop instead of a fixed sleep —
          # cold-start loading of the CSV + XGBoost model on a GHA runner
          # is variable and can exceed any fixed wait. 30 × 1s = 30s cap.
          healthy=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy after ${i}s"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "Smoke test failed — API never became healthy within 30s"
            exit 1
          fi

          # The image installs requirements-api.txt (numpy 1.26 / pandas 2.2 /
          # sklearn 1.5.2) — a DIFFERENT dependency universe than the dev lock the
          # unit tests run under. A /health ping never touches the model, so it
          # cannot catch a pandas-3→2 or numpy-2→1 inference break. Drive a real
          # /predict end to end against the shipped image, with values pulled from
          # /meta so they are guaranteed in-domain.
          OCC=$(curl -sf http://localhost:8000/meta | jq -r '.occupations[0]')
          EDU=$(curl -sf http://localhost:8000/meta | jq -r '.education_levels[0]')
          ST=$(curl -sf http://localhost:8000/meta | jq -r '.states[0]')
          echo "predict probe: state=$ST occupation=$OCC education=$EDU"
          BODY=$(jq -nc --arg st "$ST" --arg occ "$OCC" --arg edu "$EDU" \
            '{state:$st, occupation:$occ, education_level:$edu, gender:"Female", age:32}')
          RESP=$(curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "predict response: $RESP"
          # Assert it is a real, sane prediction (positive median, ordered quantiles)
          # — proves the model actually runs under the shipped dependency stack.
          echo "$RESP" | jq -e \
            '.predicted_p50 > 0 and .predicted_p10 <= .predicted_p50 and .predicted_p50 <= .predicted_p90' \
            > /dev/null || { echo "Smoke test failed — /predict did not return a valid prediction"; exit 1; }
          echo "Smoke test passed — /health + real /predict OK on the shipped image"

      - name: Push API image (post-scan + post-smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/api:latest
            ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          cache-from: type=gha

      - name: Build Dashboard image (load for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}/dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan Dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/dashboard:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: .trivyignore

      - name: Push Dashboard image (post-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/dashboard:latest
            ${{ env.IMAGE_BASE }}/dashboard:${{ github.sha }}
          cache-from: type=gha
